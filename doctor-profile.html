<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Profile</title>

  <link rel="stylesheet" href="doctor-profile.css">
</head>
<body>

  <div class="profile-container">

    <!-- Doctor Image -->

    <div class="doctor-image">
      <img src="https://randomuser.me/api/portraits/women/65.jpg" alt="Doctor">
    </div>

    <!-- Doctor Details -->

    <div class="doctor-details">

      <h1>Dr. Priya Sharma</h1>

      <h3>Orthodontist</h3>

      <p>
        Experienced dental specialist providing high-quality
        dental care and advanced treatments for healthy smiles.
      </p>

      <!-- Experience -->

      <div class="detail-box">
        <h4>Experience</h4>
        <p>8+ Years</p>
      </div>

      <!-- Available Timings -->

      <div class="detail-box">
        <h4>Available Timings</h4>
        <p>10:00 AM - 4:00 PM</p>
      </div>

      <!-- Consultation -->

      <div class="detail-box">
        <h4>Consultation Fee</h4>
        <p>₹500</p>
      </div>

      <!-- Button -->

      <button>Book Appointment</button>

    </div>

  </div>

</body>
</html>
