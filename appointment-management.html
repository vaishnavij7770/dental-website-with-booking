<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Management</title>

  <link rel="stylesheet" href="appointment-management.css">
</head>
<body>

  <div class="container">

    <h1>My Appointments</h1>

    <!-- Appointment Card -->

    <div class="appointment-card">

      <h3>Dr. Priya Sharma</h3>

      <p><strong>Treatment:</strong> Teeth Cleaning</p>
      <p><strong>Date:</strong> 20 May 2026</p>
      <p><strong>Time:</strong> 11:00 AM</p>

      <div class="button-group">
        <button class="reschedule-btn">Reschedule</button>
        <button class="cancel-btn">Cancel</button>
      </div>

    </div>

    <!-- Appointment Card -->

    <div class="appointment-card">

      <h3>Dr. Rahul Mehta</h3>

      <p><strong>Treatment:</strong> Root Canal</p>
      <p><strong>Date:</strong> 25 May 2026</p>
      <p><strong>Time:</strong> 2:00 PM</p>

      <div class="button-group">
        <button class="reschedule-btn">Reschedule</button>
        <button class="cancel-btn">Cancel</button>
      </div>

    </div>

    <p id="message"></p>

  </div>

  <script src="appointment-management.js"></script>

</body>
</html>
