<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment</title>

  <link rel="stylesheet" href="booking.css">
</head>
<body>

  <div class="container">

    <form id="bookingForm">

      <h2>Book Appointment</h2>

      <!-- Select Doctor -->

      <div class="input-box">
        <label for="doctor">Select Doctor</label>

        <select id="doctor" title="Select Doctor">
          <option value="">Choose Doctor</option>
          <option>Dr. Priya Sharma</option>
          <option>Dr. Rahul Mehta</option>
          <option>Dr. Sneha Patil</option>
        </select>
      </div>

      <!-- Treatment -->

      <div class="input-box">
        <label for="treatment">Select Treatment</label>

        <select id="treatment" title="Select Treatment">
          <option value="">Choose Treatment</option>
          <option>Teeth Cleaning</option>
          <option>Teeth Whitening</option>
          <option>Root Canal</option>
          <option>Braces Consultation</option>
        </select>
      </div>

      <!-- Appointment Date -->

      <div class="input-box">
        <label for="date">Select Date</label>

        <input type="date" id="date" title="Select Date" placeholder="Select Date">
      </div>

      <!-- Time Slot -->

      <div class="input-box">
        <label for="time">Select Time Slot</label>

        <select id="time" name="time" title="Select Time Slot">
          <option value="">Choose Time</option>
          <option>10:00 AM</option>
          <option>11:00 AM</option>
          <option>1:00 PM</option>
          <option>3:00 PM</option>
        </select>
      </div>

      <button type="submit">Confirm Booking</button>

      <p id="message"></p>

    </form>

  </div>

  <script src="booking.js"></script>

</body>
</html>
