{% extends "layout.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}

<section class="profile-section">

    <div class="profile-card">

        <h2>My Profile</h2>

        <form method="POST">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ patient['name'] }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    value="{{ patient['email'] }}"
                    readonly
                >

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ patient['phone'] }}"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

            </div>

            <button type="submit" class="btn">

                <i class="fa-solid fa-floppy-disk"></i>
                Update Profile

            </button>

        </form>

    </div>

    <div class="profile-info">

        <div class="info-card">

            <i class="fa-solid fa-user"></i>

            <h3>{{ patient['name'] }}</h3>

            <p>Registered Patient</p>

        </div>

        <div class="info-card">

            <i class="fa-solid fa-envelope"></i>

            <h4>Email</h4>

            <p>{{ patient['email'] }}</p>

        </div>

        <div class="info-card">

            <i class="fa-solid fa-phone"></i>

            <h4>Phone</h4>

            <p>{{ patient['phone'] }}</p>

        </div>

    </div>

</section>

{% endblock %}
