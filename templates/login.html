<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <nav>

        <div class="logo">

            DentalCare

        </div>

        <ul>

            <li><a href="/">Home</a></li>

            <li><a href="/register">Register</a></li>

        </ul>

    </nav>


    <div class="form-container">

        <div class="form-box">

            <h2>

                Patient Login

            </h2>

            {% with messages = get_flashed_messages() %}

            {% if messages %}

            {% for message in messages %}

            <div class="message">

                {{ message }}

            </div>

            {% endfor %}

            {% endif %}

            {% endwith %}


            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="submit">

                    Login

                </button>

            </form>

            <p>

                Don't have an account?

                <a href="/register">

                    Register Here

                </a>

            </p>

        </div>

    </div>

</body>

</html>
