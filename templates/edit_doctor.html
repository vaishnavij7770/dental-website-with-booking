{% extends "layout.html" %}

{% block title %}Edit Doctor{% endblock %}

{% block content %}

<div class="form-container">

    <h2>
        <i class="fa-solid fa-user-pen"></i>
        Edit Doctor
    </h2>

    <form method="POST">

        <div class="form-group">

            <label>Doctor Name</label>

            <input
                type="text"
                name="name"
                value="{{ doctor['name'] }}"
                required
            >

        </div>

        <div class="form-group">

            <label>Specialization</label>

            <input
                type="text"
                name="specialization"
                value="{{ doctor['specialization'] }}"
                required
            >

        </div>

        <div class="form-group">

            <label>Experience (Years)</label>

            <input
                type="number"
                name="experience"
                value="{{ doctor['experience'] }}"
                min="0"
                required
            >

        </div>

        <div class="form-group">

            <label>Consultation Fees</label>

            <input
                type="number"
                name="fees"
                value="{{ doctor['fees'] }}"
                min="0"
                required
            >

        </div>

        <div class="form-group">

            <label>Doctor Image URL</label>

            <input
                type="text"
                name="image"
                value="{{ doctor['image'] }}"
                required
            >

        </div>

        <div class="form-group">

            <label>About Doctor</label>

            <textarea
                name="about"
                rows="5"
                required
            >{{ doctor['about'] }}</textarea>

        </div>

        <div class="form-buttons">

            <button type="submit" class="btn">

                <i class="fa-solid fa-floppy-disk"></i>

                Update Doctor

            </button>

            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-danger">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
